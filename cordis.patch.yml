# dsh-memory 的 bundle 补丁：只做"把插件挂进来"这一件事。
#
# ⚠ 规矩（2026-10-10 血教训）：不要手改 profile 的 dsh.profile.bundles —— 那是插件管理/快照系统的地盘。
#   挂载走桌面版「插件」页或官方 `pnpm` / `dsh plugin`。
#
# 本插件**只有 host 半边**（index.js），没有 client.js：
#   不做那半边，就没有"客户端 import 失败把整个页面搞崩"的风险面（explore-hub 那次）。
#   代价：没有设置页 UI，配置直接写在这个文件里。
- insert:
    - id: dsh-memory
      name: dsh-memory
      config:
        # 工作区根（memory\ 在它下面；有 tools\ 就优先用那边的最新脚本）
        workspace: 'C:\Users\33911\Documents\deepseek-harness\default-workspace'
        # 每隔多少分钟跑一次"沉降 + 衰减 + 盒子结算"（0 = 关闭定时，只留工具）
        # 2026-11-13 深夜临时改 5：为了重启后几分钟内就能看到第一轮 tick 日志；验证完改回 30
        tickMinutes: 5
